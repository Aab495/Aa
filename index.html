<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='420 222 338 338'%3E%3Crect x='420' y='222' width='338' height='338' rx='70' fill='%23162039'/%3E%3Cpath d='M588%20258L473%20325V460L589%20526%20705%20460V376H669V438L589%20485%20509%20438V346L588%20300%20603%20307%20620%20276Z' fill='%23CBB174'/%3E%3Crect x='655' y='308' width='33' height='33' fill='%23659E7D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Jost:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0F3B33;
  --emerald-2:#17503F;
  --emerald-deep:#0A2A24;
  --gold:#C9A24A;
  --gold-light:#E9D293;
  --gold-dark:#8C6A22;
  --sand:#EFE6D6;
  --sand-2:#F8F4EC;
  --mint:#E3ECE7;
  --ink:#1D2321;
  --muted:#5F6A66;
  --line:#E6E0D4;
  --white:#FFFFFF;
  --font-display:'Marcellus', Georgia, serif;
  --font-body:'Jost', system-ui, -apple-system, sans-serif;
  --radius-m:14px;
  --radius-l:28px;
}
html[lang="ar"]{
  --font-display:'Amiri', 'Times New Roman', serif;
  --font-body:'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:400 16px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
html[lang="ar"] body{line-height:1.75}
svg{display:block}
button,input{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.container{width:100%;max-width:1240px;margin-inline:auto;padding-inline:24px}
.i{width:22px;height:22px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--emerald);color:#fff;padding:10px 16px;border-radius:999px;z-index:100;text-decoration:none}
.skip:focus{top:12px}
body.locked{overflow:hidden}
section[id],footer[id]{scroll-margin-top:84px}
.flip{display:grid}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font:500 15px/1 var(--font-body);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background-color .2s,color .2s,border-color .2s;white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn--gold{background:var(--gold);color:var(--emerald-deep)}
.btn--gold:hover{background:var(--gold-light)}
.btn--ghost{border-color:rgba(255,255,255,.45);color:#fff;background:transparent}
.btn--ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn--dark{background:var(--emerald);color:#fff}
.btn--dark:hover{background:var(--emerald-2)}
.btn--block{width:100%}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--sand-2)}
.iconbtn--light{color:#fff;border:1px solid rgba(255,255,255,.3)}
.iconbtn--light:hover{background:rgba(255,255,255,.08)}
.badge{position:absolute;top:3px;inset-inline-end:1px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--emerald-deep);font-size:11px;font-weight:600;line-height:18px;text-align:center;padding:0 5px;font-family:'Jost',sans-serif}
.badge[hidden]{display:none}
.badge.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.35)}}

/* Rate bar */
.ratebar{background:var(--emerald-deep);color:#D3DFD9;font-size:13px}
.ratebar__in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:40px}
.rates{display:flex;align-items:center;gap:18px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.rates::-webkit-scrollbar{display:none}
.rates__label{color:var(--gold-light)}
.rate__k{color:var(--gold)}
.rate{display:inline-flex;gap:6px;direction:ltr;unicode-bidi:isolate}
.rate b{color:#fff;font-weight:500;font-variant-numeric:tabular-nums;font-family:'Jost',sans-serif}
.rates__demo{font-size:11px;border:1px solid rgba(233,210,147,.35);border-radius:999px;padding:1px 8px;color:var(--gold-light)}
.ratebar__links{display:flex;align-items:center;gap:20px;flex:none}
.ratebar__links a{text-decoration:none}
.ratebar__links a:hover{color:#fff}
.langbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#fff;font:500 13px 'Jost','IBM Plex Sans Arabic',sans-serif;cursor:pointer;padding:6px 0}
.langbtn .i{width:16px;height:16px}

/* Header */
.hdr{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;gap:24px;height:76px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--emerald);flex:none}
.logo svg{width:36px;height:40px}
.logo__name{font-family:'Jost',sans-serif;font-weight:500;font-size:21px;letter-spacing:.34em;line-height:1;display:block}
html[lang="ar"] .logo__name{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;letter-spacing:0;font-size:30px;line-height:.95}
.logo__sub{display:block;font-size:11px;color:var(--gold-dark);letter-spacing:.04em;margin-top:5px;line-height:1}
html[lang="ar"] .logo__sub{letter-spacing:0;margin-top:7px}
.nav{display:flex;gap:20px;flex:1;justify-content:center}
.nav a{text-decoration:none;font-weight:500;font-size:15px;padding-block:8px;position:relative;white-space:nowrap}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:1.5px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.nav a:hover::after{transform:scaleX(1)}
.hdr__actions{display:flex;gap:2px;margin-inline-start:auto}
.hdr__menu{display:none}

/* Hero */
.hero{position:relative;background:var(--emerald);color:#fff;overflow:hidden}
.hero__in{position:relative;padding-block:56px 36px}
.slides{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
.slide.is-active{opacity:1;visibility:visible;transition:opacity .7s ease}
.slide__kicker{color:var(--gold-light);font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:12px}
.slide__kicker::before{content:"";width:32px;height:1px;background:var(--gold)}
.slide__title{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,5.4vw,68px);line-height:1.06;margin:0 0 18px;max-width:13ch}
html[lang="ar"] .slide__title{line-height:1.35;max-width:12ch}
.slide__text{color:#D5E0DA;font-size:18px;max-width:40ch;margin:0 0 30px}
.slide__ctas{display:flex;flex-wrap:wrap;gap:12px}
.slide__art{width:100%;max-width:460px;aspect-ratio:1;justify-self:center}
.slide__art svg{width:100%;height:100%}
.hero__ctrl{display:flex;align-items:center;gap:10px;margin-top:32px}
.dots{display:flex;gap:6px}
.dot{position:relative;width:40px;height:32px;border:0;background:none;padding:0;cursor:pointer}
.dot::after{content:"";position:absolute;inset-inline:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:rgba(255,255,255,.25)}
.dot__fill{position:absolute;inset-inline-start:0;top:50%;height:3px;margin-top:-1.5px;width:0;border-radius:2px;background:var(--gold);z-index:1}
.dot[aria-current="true"] .dot__fill{animation:fill 6.5s linear forwards}
/* Pause on mouse hover or keyboard focus (plain :hover/:focus-within stick after a tap or click) */
@media (hover:hover){.hero:hover .dot__fill{animation-play-state:paused}}
.hero:has(:focus-visible) .dot__fill{animation-play-state:paused}
@keyframes fill{from{width:0}to{width:100%}}

/* Sections */
.sec{padding-block:72px}
.h2{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.15;margin:0}
html[lang="ar"] .h2{line-height:1.4}
.sec__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:28px;flex-wrap:wrap}
.textlink{font-weight:500;color:var(--emerald);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px;text-decoration-thickness:1.5px}
.textlink:hover{color:var(--gold-dark)}

/* Categories */
.cats__row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:28px}
.cat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;text-decoration:none}
.cat__art{width:100%;aspect-ratio:1;border-radius:50%;background:var(--sand);display:grid;place-items:center;overflow:hidden;transition:background-color .25s}
.cat:hover .cat__art{background:#E8DCC6}
.cat__art svg{width:70%;height:70%;transition:transform .35s ease}
.cat:hover .cat__art svg{transform:scale(1.06)}
.cat__name{font-weight:500}
.cat__count{font-size:13px;color:var(--muted);margin-top:-8px}

/* Tabs + grid */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:500 14px var(--font-body);color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{border-color:var(--emerald)}
.tab[aria-pressed="true"]{background:var(--emerald);border-color:var(--emerald);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.card{position:relative;display:flex;flex-direction:column}
.card__media{position:relative;aspect-ratio:1;border-radius:var(--radius-m);background:var(--tint);display:grid;place-items:center;overflow:hidden}
.card__media svg.art{width:76%;height:76%;transition:transform .45s ease}
.card:hover .card__media svg.art{transform:scale(1.05)}
.card__tag{position:absolute;top:12px;inset-inline-start:12px;background:#fff;color:var(--emerald);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px}
.card__wish{position:absolute;top:8px;inset-inline-end:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.card__wish .i{width:20px;height:20px}
.card__wish[aria-pressed="true"]{color:#A8322B}
.card__wish[aria-pressed="true"] path{fill:currentColor}
.card__body{padding-top:14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card__name{font-weight:500;font-size:16px;margin:0;line-height:1.35}
.card__meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.card__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;font-family:'Jost',sans-serif;white-space:nowrap}
.price small{font-weight:400;font-size:12px;color:var(--muted);margin-inline-start:4px;font-family:var(--font-body)}
.addbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--emerald);background:#fff;color:var(--emerald);display:inline-flex;align-items:center;gap:6px;font:500 14px var(--font-body);cursor:pointer;flex:none;transition:background-color .2s,color .2s}
.addbtn .i{width:18px;height:18px}
.addbtn:hover{background:var(--emerald);color:#fff}
.grid__empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* Gold bars */
.bars{background:var(--sand-2);padding-block:22px;border-block:1px solid var(--line)}
.bars__bar{display:flex;align-items:center;gap:16px}
.bars__icon{width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.bars__icon svg{width:80%;height:80%}
.bars__sum{flex:1;min-width:0}
.bars__title{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,2.2vw,26px);line-height:1.25;margin:0}
html[lang="ar"] .bars__title{line-height:1.45}
.bars__teaser{margin:2px 0 0;color:var(--muted);font-size:14px}
.bars__teaser b{color:var(--emerald);font-family:'Jost',var(--font-body);font-weight:600}
.bars__teaser b small{font-weight:400;color:var(--muted);margin-inline-start:3px}
.bars__toggle .i{width:18px;height:18px;transition:transform .3s ease}
.bars__toggle[aria-expanded="true"]{background:var(--sand);color:var(--ink);border-color:var(--line)}
.bars__toggle[aria-expanded="true"] .i{transform:rotate(180deg)}
.bars__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.bars__panel.is-open{grid-template-rows:1fr}
.bars__panel > div{overflow:hidden;min-height:0}
.bars__panel:not(.is-open) > div{visibility:hidden;transition:visibility 0s linear .45s}
.bars__panel .bars__in{padding-block:36px 14px}
.bars__in{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.bars__art{width:100%;max-width:460px;aspect-ratio:1;justify-self:center;border-radius:var(--radius-l);background:radial-gradient(circle at 50% 42%,#fff 0,#F3EBDC 55%,var(--sand) 100%);display:grid;place-items:center;position:relative;overflow:hidden}
.bars__art svg.art{width:64%;height:64%}
.lead{font-size:18px;color:var(--muted);max-width:46ch;margin:14px 0 24px}
.field-label{font-size:14px;font-weight:500;margin-bottom:10px}
.weights{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.weight{min-width:64px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:500 15px 'Jost',var(--font-body);cursor:pointer;color:var(--ink)}
.weight:hover{border-color:var(--gold-dark)}
.weight[aria-checked="true"]{border-color:var(--gold-dark);background:var(--gold);color:var(--emerald-deep)}
.bd{display:grid;grid-template-columns:1fr auto;gap:8px 24px;margin:0 0 24px;max-width:440px;font-variant-numeric:tabular-nums}
.bd dt{color:var(--muted)}
.bd dd{margin:0;text-align:end;font-family:'Jost',sans-serif}
.bd .total{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.bd dt.total{color:var(--ink);font-weight:500;align-self:end}
.bd dd.total{font-family:'Marcellus',serif;font-size:32px;line-height:1.1;color:var(--emerald)}
.bd dd.total small{font-family:var(--font-body);font-size:14px;color:var(--muted);margin-inline-start:6px}
.bars__actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.cert{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.cert .i{width:20px;height:20px;color:var(--gold-dark)}
.fine{font-size:12px;color:var(--muted);margin:18px 0 0}

/* Editorial */
.ed{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{position:relative;border-radius:var(--radius-l);padding:40px;min-height:360px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:16px;overflow:hidden}
.panel--emerald{background:var(--emerald);color:#fff}
.panel--mint{background:var(--mint)}
.panel h3{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.15;margin:0 0 12px}
html[lang="ar"] .panel h3{line-height:1.4}
.panel p{margin:0 0 24px;opacity:.85;max-width:32ch}
.panel__art svg{width:100%;height:auto}
.panel > div{position:relative}

/* Journal */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.post{text-decoration:none;display:flex;flex-direction:column;gap:10px}
.post__img{aspect-ratio:16/10;border-radius:var(--radius-m);overflow:hidden}
.post__img svg{width:100%;height:100%;transition:transform .5s ease}
.post:hover .post__img svg{transform:scale(1.03)}
.post__meta{font-size:13px;color:var(--muted);margin-top:4px}
.post__title{font-family:var(--font-display);font-size:23px;line-height:1.25;margin:0;font-weight:400}
html[lang="ar"] .post__title{line-height:1.5}

/* Services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.svc__item{display:flex;gap:14px;padding:30px 24px;border-inline-start:1px solid var(--line)}
.svc__item:first-child{border-inline-start:0;padding-inline-start:0}
.svc__icon{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sand);color:var(--emerald);display:grid;place-items:center}
.svc h3{font-size:16px;font-weight:600;margin:0 0 2px}
.svc p{margin:0;font-size:14px;color:var(--muted)}

/* Newsletter */
.nlwrap{padding-block:72px}
.nl{position:relative;overflow:hidden;background:var(--emerald);color:#fff;border-radius:var(--radius-l);padding:48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.nl > *{position:relative}
.nl p{margin:10px 0 0;color:#D5E0DA;max-width:40ch}
.nl__row{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;max-width:480px}
.nl__row input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:0 16px;font-size:16px;color:var(--ink);outline:0}
.nl__row:focus-within{box-shadow:0 0 0 2px var(--gold)}
.nl__err{color:#FFD5CF;font-size:14px;margin:10px 4px 0}

/* Footer */
.ftr{background:var(--emerald-deep);color:#C3D1CA;padding-top:56px;font-size:15px}
.ftr__grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px}
.ftr .logo{color:#fff}
.ftr .logo__sub{color:var(--gold-light)}
.ftr__about{margin:18px 0 16px;max-width:34ch}
.ftr h4{color:var(--gold-light);font-weight:500;font-size:15px;margin:4px 0 14px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ftr a{text-decoration:none}
.ftr a:hover{color:#fff}
.ftr__care b{display:block;color:#fff;font-weight:500;font-family:'Jost',sans-serif;font-size:18px;direction:ltr;text-align:start}
.ftr__bottom{border-top:1px solid rgba(233,210,147,.16);margin-top:48px;padding-block:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px}
.ftr__region{display:inline-flex;align-items:center;gap:8px}
.ftr__region .i{width:16px;height:16px}
.pay{display:flex;gap:6px;flex-wrap:wrap}
.pay span{border:1px solid rgba(233,210,147,.25);border-radius:6px;padding:2px 8px;font-size:12px;font-family:'Jost',sans-serif}

/* Floating chat */
.chat{position:fixed;bottom:20px;inset-inline-end:20px;z-index:30;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--emerald);color:#fff;font:500 15px var(--font-body);cursor:pointer;box-shadow:0 10px 30px rgba(10,42,36,.28)}
[dir="rtl"] .chat{padding:0 16px 0 20px}
.chat .i{color:var(--gold-light)}

/* Layers */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,42,36,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.is-on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:min(420px,100%);background:#fff;z-index:60;display:flex;flex-direction:column;visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s linear .35s}
.drawer.is-open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.drawer--end{inset-inline-end:0;transform:translateX(100%)}
[dir="rtl"] .drawer--end{transform:translateX(-100%)}
.drawer--start{inset-inline-start:0;transform:translateX(-100%)}
[dir="rtl"] .drawer--start{transform:translateX(100%)}
.drawer.is-open{transform:none}
.drawer__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);min-height:72px}
.drawer__head h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.drawer__body{flex:1;overflow:auto;padding:4px 20px}
.drawer__foot{border-top:1px solid var(--line);padding:18px 20px 22px;display:grid;gap:10px}
.drawer__foot[hidden]{display:none}
.sub{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:600}
.sub b{font-family:'Jost',sans-serif;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13px;color:var(--muted)}
.ci{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci__img{width:84px;height:84px;border-radius:12px;background:var(--tint);display:grid;place-items:center;flex:none}
.ci__img svg{width:80%;height:80%}
.ci__main{flex:1;min-width:0;display:grid;gap:2px}
.ci__name{font-weight:500;line-height:1.35}
.ci__meta{font-size:13px;color:var(--muted)}
.ci__row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:34px;height:34px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);border-radius:50%}
.qty button:hover{background:var(--sand-2)}
.qty .i{width:16px;height:16px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-family:'Jost',sans-serif}
.ci__rm{justify-self:start;background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.empty{text-align:center;padding:56px 12px;color:var(--muted);display:grid;gap:18px;justify-items:center}
.empty__icon{width:72px;height:72px;border-radius:50%;background:var(--sand-2);display:grid;place-items:center;color:var(--emerald)}
.empty__icon .i{width:30px;height:30px}
.empty p{margin:0;max-width:28ch}

.mnav{display:grid;padding:4px 20px}
.mnav a{font-family:var(--font-display);font-size:24px;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mnav a .i{color:var(--gold-dark);width:18px;height:18px}
.msub{display:grid;padding:12px 20px}
.msub a,.msub button{display:flex;align-items:center;gap:12px;padding:10px 0;text-decoration:none;background:none;border:0;font:500 15px var(--font-body);color:var(--ink);cursor:pointer;text-align:start}
.msub .i{color:var(--emerald);width:20px;height:20px}
.mrates{margin:auto 20px 20px;background:var(--emerald);color:#D3DFD9;border-radius:16px;padding:16px 18px;font-size:14px}
.mrates__head{display:flex;justify-content:space-between;align-items:center;color:var(--gold-light);margin-bottom:10px}
.mrates__grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.mrates__grid div{display:flex;justify-content:space-between}
.mrates__grid b{color:#fff;font-weight:500;font-family:'Jost',sans-serif}

.search{position:fixed;top:0;inset-inline:0;z-index:70;background:#fff;padding-block:20px 28px;transform:translateY(-100%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s;box-shadow:0 20px 40px rgba(10,42,36,.14);max-height:88vh;overflow:auto}
.search.is-open{transform:none;visibility:visible;transition:transform .3s ease}
.search__bar{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--emerald);padding-bottom:8px}
.search__bar:focus-within{border-color:var(--gold-dark)}
.search__bar > .i{color:var(--muted);flex:none}
.search__bar input{flex:1;min-width:0;border:0;outline:0;font-size:22px;color:var(--ink);background:transparent;padding:6px 0}
.search__chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--muted)}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--sand-2);color:var(--ink);cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--gold-dark)}
.search__count{font-size:13px;color:var(--muted);margin:20px 0 6px}
.search__res{display:grid;gap:4px}
.sr{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px;margin-inline:-8px}
.sr:hover{background:var(--sand-2)}
.sr__img{width:56px;height:56px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:none}
.sr__img svg{width:80%;height:80%}
.sr__main{flex:1;min-width:0}
.sr__name{font-weight:500;line-height:1.3}
.sr__meta{font-size:13px;color:var(--muted)}
.search__empty{color:var(--muted);margin:24px 0 0}

.toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--emerald-deep);color:#fff;border-radius:999px;padding-block:8px;padding-inline:20px 8px;display:flex;align-items:center;gap:14px;font-size:14px;transition:opacity .25s,transform .25s;width:max-content;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(10,42,36,.25)}
.toast--plain{padding-inline:20px;padding-block:12px}
.toast.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--gold);color:var(--emerald-deep);font-weight:500;cursor:pointer;white-space:nowrap;flex:none}

/* Stores on the home page */
.sec__sub{margin:8px 0 0;color:var(--muted);max-width:52ch}
.scards{display:grid;grid-auto-flow:column;grid-auto-columns:288px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}
.scards::-webkit-scrollbar{display:none}
.scard{scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.scard__cover{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.scard__cover span{aspect-ratio:1;background:var(--tint);display:grid;place-items:center}
.scard__cover svg{width:78%;height:78%}
.scard__body{padding:0 16px 16px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
.scard__ring{margin-top:-32px;margin-bottom:8px;position:relative}
.scard__name{display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px;margin:0;line-height:1.3}
.scard__name a{text-decoration:none}
.scard__name a:hover{text-decoration:underline;text-underline-offset:3px}
.scard__handle{font-size:13px;color:var(--muted)}
.scard__meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:8px 0 16px}
.scard__meta span{display:inline-flex;align-items:center;gap:4px}
.scard__meta .i{width:15px;height:15px}
.scard__meta b{color:var(--ink);font-weight:600;font-family:'Jost',var(--font-body)}
.scard__btns{display:flex;gap:8px;width:100%;margin-top:auto}
.scard__btns .btn{flex:1}
.btn--sm{height:38px;padding:0 16px;font-size:14px}
.btn--soft{background:var(--sand-2);border-color:var(--line);color:var(--ink)}
.btn--soft:hover{background:var(--sand)}
.btn[data-follow][aria-pressed="true"]{background:var(--sand-2);border-color:var(--line);color:var(--ink)}

/* Avatars, story ring, verified badge */
.av{display:grid;place-items:center;border-radius:50%;background:var(--av,#0F3B33);color:#F3EDE1;font-family:var(--font-display);line-height:1;flex:none;user-select:none}
.av--sm{width:32px;height:32px;font-size:15px}
.av--md{width:62px;height:62px;font-size:27px}
.av--xl{width:150px;height:150px;font-size:62px}
.ring{display:inline-grid;place-items:center;border:0;padding:5px;border-radius:50%;background:conic-gradient(from 200deg,#CBB174,#659E7D,#E9D293,#CBB174);cursor:pointer;flex:none}
.ring > .av{box-shadow:0 0 0 2.5px #fff}
.ring.seen{background:var(--line)}
.ring--sm{padding:3.5px}
.ring--sm > .av{box-shadow:0 0 0 1.5px #fff}
.vbadge{width:18px;height:18px;flex:none}

/* Store profile */
.profile{position:fixed;inset:0;z-index:45;background:#fff;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s linear .25s}
.profile.is-open{visibility:visible;opacity:1;transition:opacity .25s}
.pf__bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line)}
.pf__bar-in{max-width:975px;margin-inline:auto;padding:0 12px;height:60px;display:flex;align-items:center;gap:6px}
.pf__bartitle{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px;min-width:0}
.pf__bartitle > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf__wrap{max-width:975px;margin-inline:auto;padding:36px 20px 72px}
.pf__head{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"av title btns" "av stats stats" "av bio bio";column-gap:20px;row-gap:16px;align-items:center;padding-inline-start:44px;margin-bottom:40px}
.pf__av{grid-area:av;margin-inline-end:64px;align-self:start}
.pf__title{grid-area:title;display:flex;align-items:center;gap:6px;font-size:20px;font-weight:500;margin:0;font-family:'Jost',var(--font-body)}
.pf__btns{grid-area:btns;display:flex;gap:8px}
.pf__stats{grid-area:stats;display:flex;gap:36px;list-style:none;margin:0;padding:0;font-size:16px}
.pf__stats b{font-weight:600;font-family:'Jost',var(--font-body)}
.pf__bio{grid-area:bio;font-size:15px;line-height:1.55}
.pf__name{font-weight:600;display:block}
.pf__cat{color:var(--muted);display:block;font-size:14px}
.pf__bio p{margin:4px 0}
.pf__loc{display:inline-flex;align-items:center;gap:4px;color:var(--emerald);font-weight:500}
.pf__loc .i{width:16px;height:16px}
.hls{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none;padding:6px 44px 32px}
.hls::-webkit-scrollbar{display:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;flex:none;font:500 13px var(--font-body);color:var(--ink);padding:0}
.hl__img{width:80px;height:80px;border-radius:50%;background:var(--tint);display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.hl__img svg{width:70%;height:70%}
.hl:hover .hl__img{box-shadow:0 0 0 3px #fff,0 0 0 4px var(--gold)}
.pf__tabs{display:flex;justify-content:center;gap:56px;border-top:1px solid var(--line)}
.ptab{display:flex;align-items:center;gap:6px;height:52px;border:0;border-top:1px solid transparent;margin-top:-1px;background:none;cursor:pointer;color:var(--muted);font:600 14px var(--font-body);padding:0 4px}
.ptab .i{width:17px;height:17px}
.ptab[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pt{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--tint);display:grid;place-items:center;cursor:pointer;overflow:hidden;border-radius:4px}
.pt svg.art{width:70%;height:70%}
.pt__price{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 9px;font:600 12px 'Jost',var(--font-body);color:var(--ink);white-space:nowrap}
.pt__ov{position:absolute;inset:0;background:rgba(10,42,36,.45);display:flex;align-items:center;justify-content:center;gap:22px;color:#fff;font:600 16px 'Jost',var(--font-body);opacity:0;transition:opacity .2s}
.pt__ov span{display:inline-flex;align-items:center;gap:6px}
.pt__ov .i{fill:#fff;width:20px;height:20px}
.pt:hover .pt__ov,.pt:focus-visible .pt__ov{opacity:1}
@media (hover:none){.pt__ov{display:none}}
.revs,.info{max-width:640px;margin:24px auto 0}
.revs__sum{display:flex;align-items:center;gap:16px;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.revs__big{font-family:'Marcellus',serif;font-size:46px;color:var(--emerald);line-height:1}
.stars{display:inline-flex;gap:2px;color:var(--gold);vertical-align:middle}
.stars .i{width:15px;height:15px;fill:currentColor}
.stars .off{color:var(--line)}
.rev{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.rev__name{font-weight:600}
.rev__date{font-size:13px;color:var(--muted)}
.rev p{margin:6px 0 0}
.info__row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.info__row > .i{color:var(--emerald);margin-top:2px;flex:none}
.info__k{font-size:13px;color:var(--muted)}
.info__v{font-weight:500}

/* Post viewer */
.pm{position:fixed;inset:0;z-index:75;display:grid;place-items:center;padding:40px 64px;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s linear .2s}
.pm.is-open{visibility:visible;opacity:1;transition:opacity .2s}
.pm__backdrop{position:absolute;inset:0;background:rgba(8,18,16,.74)}
.pm__x{position:absolute;top:12px;inset-inline-end:12px;color:#fff;z-index:2}
.pm__x:hover{background:rgba(255,255,255,.12)}
.pm__x2{display:none}
.pm__card{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"media head" "media body" "media foot";width:min(1020px,100%);height:min(660px,100%);background:#fff;border-radius:10px;overflow:hidden}
.pm__head{grid-area:head;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line)}
.pm__who{flex:1;min-width:0}
.pm__line{display:flex;align-items:center;gap:5px}
.pm__line a{text-decoration:none;font-weight:600;font-family:'Jost',var(--font-body)}
.pm__city{font-size:12px;color:var(--muted);line-height:1.3}
.pm__follow{border:0;background:none;color:var(--emerald);font:600 14px var(--font-body);cursor:pointer;padding:6px}
.pm__follow[aria-pressed="true"]{color:var(--muted)}
.pm__media{grid-area:media;position:relative;background:var(--tint);display:grid;place-items:center;user-select:none;cursor:pointer;min-height:0}
.pm__media svg.art{width:72%;height:72%}
.pm__burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.pm__burst .i{width:110px;height:110px;fill:#fff;stroke:#fff;filter:drop-shadow(0 6px 18px rgba(0,0,0,.22))}
.pm__burst.go{animation:burst .85s ease forwards}
@keyframes burst{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
.pm__body{grid-area:body;overflow-y:auto;padding:14px 16px;display:grid;align-content:start;gap:16px;border-inline-start:1px solid var(--line)}
.cmt{display:flex;gap:10px;font-size:14px;line-height:1.5}
.cmt b{font-weight:600;margin-right:6px;font-family:'Jost',var(--font-body)}
[dir="rtl"] .cmt b{margin-right:0;margin-left:6px}
.cmt time{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.pm__specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pm__specs span{font-size:12px;background:var(--sand-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.pm__foot{grid-area:foot;border-top:1px solid var(--line);border-inline-start:1px solid var(--line);padding:6px 10px 10px}
.pm__acts{display:flex;align-items:center}
.pm__acts .iconbtn{width:42px;height:42px}
.pm__acts .spacer{flex:1}
.pm__acts [data-like][aria-pressed="true"]{color:#C2413A}
.pm__acts [aria-pressed="true"] .i{fill:currentColor}
.pm__acts [data-like].pop .i{animation:bump .35s ease}
.pm__likes{font-weight:600;font-size:14px;padding:0 8px}
.pm__likes b{font-family:'Jost',var(--font-body)}
.pm__buy{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 8px;margin-top:8px;border-top:1px solid var(--line)}
.pm__buy .price{font-size:18px}
.pm__form{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 8px 0}
.pm__form input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:10px 0;background:transparent;color:var(--ink)}
.pm__form button{border:0;background:none;color:var(--emerald);font:600 14px var(--font-body);cursor:pointer;padding:6px}
.pm__form button:disabled{opacity:.4;cursor:default}

/* Story viewer */
.st{position:fixed;inset:0;z-index:85;background:#0B1412;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s linear .2s}
.st.is-open{visibility:visible;opacity:1;transition:opacity .2s}
.st__frame{position:relative;width:min(420px,100vw);height:min(92vh,746px);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1E5A4B 0,#0F3B33 45%,#0A2A24 100%);color:#fff;touch-action:manipulation;user-select:none}
.st__bars{position:absolute;top:10px;inset-inline:10px;display:flex;gap:4px;z-index:3}
.st__seg{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.st__seg i{position:absolute;top:0;bottom:0;inset-inline-start:0;width:0;background:#fff;border-radius:2px}
.st__seg.done i{width:100%}
.st__seg.cur i{animation:fill 5s linear forwards}
.st.paused .st__seg.cur i{animation-play-state:paused}
.st__head{position:absolute;top:20px;inset-inline:10px;display:flex;align-items:center;gap:10px;z-index:3;font-size:14px}
.st__who{display:flex;align-items:center;gap:8px;min-width:0}
.st__who b{font-weight:600;font-family:'Jost',var(--font-body)}
.st__who .av{box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.st.is-open ~ .toast{bottom:auto;top:84px}
.st__time{opacity:.72}
.st__x{margin-inline-start:auto;color:#fff}
.st__x:hover{background:rgba(255,255,255,.12)}
.st__media{position:absolute;inset:0;display:grid;place-items:center;padding:84px 28px 190px}
.st__media svg.art{width:88%;height:auto;max-height:100%;filter:drop-shadow(0 22px 40px rgba(0,0,0,.35))}
.st__nav{position:absolute;top:76px;bottom:190px;width:42%;border:0;background:none;z-index:2;cursor:pointer;padding:0}
.st__nav--prev{inset-inline-start:0}
.st__nav--next{inset-inline-end:0}
.st__foot{position:absolute;inset-inline:0;bottom:0;z-index:3;padding:24px 20px 24px;background:linear-gradient(transparent,rgba(5,20,17,.88));display:grid;gap:14px}
.st__name{font-family:var(--font-display);font-size:25px;line-height:1.2}
.st__meta{font-size:14px;color:#D5E0DA}
.st__row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.st__row .price{font-size:18px;color:#fff}
.st__row .price small{color:#D5E0DA}
.st__btns{display:flex;gap:8px}

@media (max-width:860px){
  .pm{padding:0;display:block;overflow-y:auto;overscroll-behavior:contain}
  .pm__card{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "media" "foot" "body";height:auto;min-height:100%;border-radius:0;align-content:start}
  .pm__head,.pm__body,.pm__foot{border-inline-start:0}
  .pm__x{display:none}
  .pm__x2{display:grid}
  .pm__media{aspect-ratio:1;min-height:auto}
  .pm__body{overflow:visible;padding-bottom:40px}
}
@media (max-width:735px){
  .pf__wrap{padding:16px 16px 56px}
  .pf__head{grid-template-columns:auto 1fr;grid-template-areas:"av stats" "bio bio" "btns btns";padding-inline-start:0;column-gap:20px;row-gap:12px;margin-bottom:22px}
  .pf__av{margin-inline-end:0;align-self:center}
  .av--xl{width:86px;height:86px;font-size:36px}
  .pf__title{display:none}
  .pf__stats{justify-content:space-around;gap:6px;text-align:center}
  .pf__stats li{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.35}
  .pf__stats b{color:var(--ink);font-size:17px}
  .pf__btns .btn{flex:1}
  .hls{gap:16px;padding:4px 0 22px}
  .hl__img{width:64px;height:64px}
  .pf__tabs{gap:0;margin-inline:-16px}
  .ptab{flex:1;justify-content:center}
  .ptab span{display:none}
  .ptab .i{width:22px;height:22px}
  .pgrid{gap:2px;margin-inline:-16px}
  .pt{border-radius:0}
  .pt__price{font-size:11px;bottom:6px;inset-inline-start:6px;padding:1px 6px}
}
@media (max-width:520px){
  .st__frame{width:100vw;height:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){
  .st__seg.cur i{width:100%}
}

.sr .av--md{width:56px;height:56px;font-size:24px}

/* Chat button steps aside while the green hero is on screen (phones) */
.chat{transition:opacity .25s,transform .25s}
.chat.is-away{opacity:0;pointer-events:none;transform:translateY(16px)}

/* Product video posts */
img.art-photo,video.art-video{display:block;width:100%;height:100%;object-fit:cover;object-position:6% 50%}
.pt img.art-photo,.pt video.art-video{position:absolute;inset:0}
.pt__reel{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;display:grid;place-items:center;z-index:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.pt__reel .i{width:20px;height:20px;fill:#fff;color:#fff}
.hl__img,.ci__img,.scard__cover span{overflow:hidden}
.pm__media img.art-photo,.pm__media video.art-video{position:absolute;inset:0}
.pm__vbtn{position:absolute;bottom:12px;inset-inline-start:12px;z-index:2;color:#fff;background:rgba(10,20,18,.45);width:40px;height:40px}
.pm__vbtn:hover{background:rgba(10,20,18,.65)}
.pm__vbtn .i{width:18px;height:18px}
.st__media img.art-photo,.st__media video.art-video{position:absolute;inset:0;filter:none}

/* Shop video story */
.st__media video.st__shop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}

/* Responsive */
@media (max-width:1200px){
  .nav{display:none}
  .hdr__menu{display:grid}
  .hdr__in{gap:6px;height:64px}
  .hide-sm{display:none}
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:960px){
  .slide{grid-template-columns:1fr;gap:12px}
  .slide__art{order:-1;max-width:260px}
  .slide__title{max-width:none}
  .hero__in{padding-block:28px 28px}
  .bars__in{grid-template-columns:1fr;gap:32px}
  .bars__art{max-width:340px}
  .ed{grid-template-columns:1fr}
  .svc{grid-template-columns:1fr 1fr}
  .svc__item{padding-inline:20px}
  .svc__item:nth-child(odd){border-inline-start:0;padding-inline-start:0}
  .svc__item:nth-child(n+3){border-top:1px solid var(--line)}
  .nl{grid-template-columns:minmax(0,1fr);padding:36px 28px}
  .ftr__grid{grid-template-columns:1fr 1fr}
  .ftr__brand{grid-column:1/-1}
  .cats__row{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3.3);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
  .cats__row::-webkit-scrollbar{display:none}
  .cat{scroll-snap-align:start}
  .posts{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .posts::-webkit-scrollbar{display:none}
  .post{scroll-snap-align:start}
}
@media (max-width:760px){
  .ratebar__links a{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .addbtn{width:40px;padding:0;justify-content:center}
  .addbtn span{display:none}
  .price{font-size:15px}
  .card__name{font-size:15px}
  .sec,.nlwrap{padding-block:48px}
  .chat span[data-i18n]{display:none}
  .chat{width:52px;padding:0;justify-content:center}
  .toast{bottom:86px}
}
@media (max-width:600px){
  .bars__bar{flex-wrap:wrap;gap:12px 14px}
  .bars__toggle{width:100%}
  .container{padding-inline:16px}
  .logo__sub{display:none}
  .logo svg{width:32px;height:32px}
  .logo__name{font-size:19px}
  .slide__text{font-size:16px;margin-bottom:24px}
  .slide__ctas .btn{flex:1 1 auto}
  .panel{grid-template-columns:1fr;padding:28px 24px;min-height:0}
  .panel__art{order:-1;max-width:190px;justify-self:center}
  .svc{grid-template-columns:1fr}
  .svc__item{border-inline-start:0 !important;padding:20px 0 !important}
  .svc__item:nth-child(n+2){border-top:1px solid var(--line)}
  .nl{padding:32px 22px}
  .bd dd.total{font-size:28px}
  .search__bar input{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important;animation:none !important}
  .dot[aria-current="true"] .dot__fill{width:100%}
}
</style>

/* ---------- Toast ---------- */
let tt;
function toast(msg, action){
  const el = $("#toast");
  el.innerHTML = '<span></span>' + (action ? '<button type="button" data-open="cart">' + t("view_bag") + '</button>' : '');
  el.firstChild.textContent = msg;
  el.classList.toggle("toast--plain", !action);
  el.classList.add("is-on");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("is-on"), 2800);
}

/* ---------- Layers (cart, menu, search) ---------- */
let lastFocus = null;
function openLayer(id){
  closeAll(true);
  const el = $("#" + id); if (!el) return;
  lastFocus = document.activeElement;
  el.classList.add("is-open"); el.setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("is-on"); document.body.classList.add("locked");
  setTimeout(() => { const f = id === "search" ? $("#searchInput") : el.querySelector("button, a, input"); if (f) f.focus(); }, 60);
}
function closeAll(silent){
  const open = $$(".layer.is-open");
  open.forEach(el => { el.classList.remove("is-open"); el.setAttribute("aria-hidden", "true"); });
  $("#scrim").classList.remove("is-on"); document.body.classList.remove("locked");
  if (!silent && open.length && lastFocus && lastFocus.focus) lastFocus.focus();
  if (!silent) lastFocus = null;
}
function goTo(sel){ const el = $(sel); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }

/* ---------- Actions ---------- */
function addToCart(id){
  cart.set(id, (cart.get(id) || 0) + 1);
  renderCart();
  const b = $("#cartCount"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
  toast(t("added"), true);
}
function toggleWish(id){
  const on = !wish.has(id);
  if (on) wish.add(id); else wish.delete(id);
  $$('[data-wish="' + id + '"]').forEach(b => b.setAttribute("aria-pressed", on));
  renderWishCount(); renderTabs();
  if (filter === "wish" || (!wish.size && filter === "all")) renderGrid();
  toast(on ? t("wish_added") : t("wish_removed"));
}
function openWish(){
  closeAll(true);
  if (!wish.size){ toast(t("wish_empty")); return; }
  filter = "wish"; renderTabs(); renderGrid(); goTo("#best");
}

document.addEventListener("click", e => {
  const el = e.target.closest("button, a, [data-close]");
  if (!el) return;
  if (el.matches('a[href="#"]')){ e.preventDefault(); toast(t("page_demo")); return; }
  const d = el.dataset;
  if (d.add){ addToCart(d.add); return; }
  if (d.wish){ toggleWish(d.wish); return; }
  if (d.f){ filter = d.f; renderTabs(); renderGrid(); return; }
  if (d.cat){
    e.preventDefault(); closeAll(true);
    if (d.cat === "bar"){ openBars(true); goTo("#bars"); return; }
    filter = d.cat; renderTabs(); renderGrid(); goTo("#best"); return;
  }
  if (d.search){
    e.preventDefault(); openLayer("search");
    $("#searchInput").value = t("chip_diamond"); renderSearch(); return;
  }

    const layer = $(".layer.is-open") || $("#story.is-open") || $("#post.is-open") || $("#profile.is-open"); if (!layer) return;
    const f = $$("a[href], button:not([disabled]), input:not([disabled])", layer).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!layer.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

const slides = $$(".slide");
let cur = 0;
function renderDots(){
  $("#dots").innerHTML = slides.map((s, i) =>
    '<button class="dot" type="button" data-slide="' + i + '" aria-current="' + (i === cur) + '" aria-label="' + t("slide") + ' ' + (i + 1) + '"><span class="dot__fill"></span></button>').join("");
}
function go(i){
  const dotFocused = $("#dots").contains(document.activeElement);
  cur = (i + slides.length) % slides.length;
  slides.forEach((s, k) => { s.classList.toggle("is-active", k === cur); s.setAttribute("aria-hidden", k !== cur); if (k === cur) s.removeAttribute("aria-hidden"); });
  renderDots();
  if (dotFocused) $('#dots [data-slide="' + cur + '"]').focus();
}
$("#dots").addEventListener("click", e => { const b = e.target.closest("[data-slide]"); if (b) go(+b.dataset.slide); });
$("#dots").addEventListener("animationend", () => go(cur + 1));
$("#prevSlide").addEventListener("click", () => go(cur - 1));
$("#nextSlide").addEventListener("click", () => go(cur + 1));
let sx = null;
const hero = $("#hero");
hero.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
hero.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) < 50) return;
  const fwd = (dx < 0) !== (document.documentElement.dir === "rtl");
  go(cur + (fwd ? 1 : -1));
});

  return {id:id, cat:p.cat, k:p.k, w:p.w, d:!!p.d, metal:p.metal, price:p.price, tint:TINT[p.metal],
    name:() => p.name[lang],

function barItem(w, id){
  const W = WEIGHTS.find(x => x.w === w);
  return {id:id, cat:"bar", k:24, w:w, d:false, metal:"yellow", price:barPrice(W).total, tint:TINT.yellow,
    name:() => t("bar_name") + " " + wl(w), meta:() => t("bar_meta"), svg:() => art("bar", "yellow", wlEng(w))};
}
function resolve(id){
  const parts = id.split(":");
  if (parts[0] === "bar") return barItem(parseFloat(parts[1]), id);
  const s = STORE_MAP[parts[0]];
  if (s){
    const key = parts.slice(1).join(":");
    let it;
    if (key.indexOf("bar:") === 0) it = barItem(parseFloat(key.slice(4)), id);
    else { const base = PRODUCT_MAP[key] || EXTRA[key]; it = normalize(base, id); it.price = Math.round(base.price * s.f / 10) * 10; }
    it.store = s.id;
    return it;
  }
  return normalize(PRODUCT_MAP[id], id);
}

  if (v.paused) v.play().catch(syncPvBtn); else v.pause();
}, true);

/* ---------- Shop video as each store's story (tap the store photo) ---------- */
Object.assign(D.en, {story_shop_title:"Inside the shop", story_shop_time:"Today"});
Object.assign(D.ar, {story_shop_title:"من داخل المحل", story_shop_time:"اليوم"});
const SHOP_STORY_DUR = 6.7; // seconds: the forward half of the shop footage
const storyStill = matchMedia("(prefers-reduced-motion: reduce)").matches || !!(navigator.connection && navigator.connection.saveData);
const baseOpenStory = openStory;
openStory = function(storeId, hlKey){
  baseOpenStory(storeId, hlKey);
  if (hlKey || !st) return;
  st.frames = ["@shop"].concat(st.frames.slice(0, 3));
  st.i = 0;
  renderStoryFrame();
};
function renderShopFrame(){
  const s = st.s, c = COVERS[s.id] || ["50% 50%", 0];
  $("#stBars").innerHTML = st.frames.map((f, k) => '<span class="st__seg' + (k < st.i ? " done" : k === st.i ? " cur" : "") + '"><i' + (k === st.i ? ' style="animation-duration:' + SHOP_STORY_DUR + 's"' : '') + '></i></span>').join("");
  $("#stWho").innerHTML = avatar(s, "sm") + '<b dir="ltr">' + s.h + '</b>' + (s.v ? badge() : '') + '<span class="st__time">' + t("story_shop_time") + '</span>';
  $("#stMedia").innerHTML = '<video class="st__shop" muted playsinline preload="' + (storyStill ? "none" : "auto") + '" aria-hidden="true" style="object-position:' + c[0] + '"></video>';
  const v = $("#stMedia video");
  v.poster = STORE_COVER_POSTER; v.muted = true; v.src = STORE_COVER_SRC;
  if (!storyStill) v.play().catch(() => {});
  $("#stFoot").innerHTML = '<div><div class="st__name">' + t("story_shop_title") + '</div><div class="st__meta">' + s.name[lang] + (lang === "ar" ? "، " : ", ") + s.city[lang] + '</div></div>' +
    '<div class="st__row"><span></span><div class="st__btns"><a class="btn btn--gold btn--sm" href="#store/' + s.id + '" data-store="' + s.id + '">' + t("view_store") + '</a></div></div>';
}
const baseRenderStoryFrameShop = renderStoryFrame;
renderStoryFrame = function(){
  $$("#stMedia video").forEach(v => v.pause());
  if (st && st.frames[st.i] === "@shop"){ renderShopFrame(); return; }
  baseRenderStoryFrameShop();
};
stFrame.addEventListener("pointerdown", e => {
  if (e.target.closest(".st__foot, .st__head")) return;
  const v = $("#stMedia video"); if (v) v.pause();
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => stFrame.addEventListener(ev, () => {
  const v = $("#stMedia video"); if (v && st && !storyStill && v.paused) v.play().catch(() => {});
}));

/* ---------- Start ---------- */
applyLang();
renderWishCount();
const deep = location.hash.match(/^#store\/([\w-]+)/);
if (deep && STORE_MAP[deep[1]]) openProfile(deep[1], false);
})();
</script>
